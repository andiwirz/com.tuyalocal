name: Bug report
description: Something isn't working as expected
title: "[Bug] "
labels: ["bug"]
assignees:
  - andiwirz
body:

  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Please fill in as much detail as possible — a log snippet and the DP snapshot often solve the mystery immediately.
        > **Tip:** Copy logs from **Homey app → More → Apps → Tuya Local → Settings → Logs tab**.

  - type: input
    id: driver
    attributes:
      label: Affected driver
      description: >
        Filled in automatically when the report is started from the app
        (**DP Debug → Report this device**). Otherwise: Air Conditioner, Curtain Motor,
        Dehumidifier, Doorbell, EV Charger, Fan, Garage Door, Heat Pump, Heater,
        Humidifier, Light, Pet Feeder, Presence Sensor, Smart Kettle, Smart Plug,
        Thermostat, Wall Switch, Generic Tuya Device — or "App-level".
      placeholder: "e.g. Dehumidifier"
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: App version
      description: Shown in Settings → Help tab footer
      placeholder: "e.g. 1.0.47"
    validations:
      required: true


  - type: input
    id: protocol
    attributes:
      label: Protocol version used
      description: >
        The version the device actually connected on — filled in automatically when the
        report is started from the app. One of 3.1, 3.2, 3.3, 3.4, 3.5, or "unknown".
      placeholder: "e.g. 3.3"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug. What did you expect, and what actually happened?
      placeholder: |
        Expected: ...
        Actual: ...
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open device settings
        2. Set dp_xxx to ...
        3. ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Diagnostic log snippet
      description: >
        Copy the relevant lines from Settings → Logs tab (filter to Errors or Warnings & Errors first).
        Include a few lines before and after the error.
      render: text
      placeholder: |
        12:34:01  [ERR]  [fan]  Connection timed out
        12:34:02  [WRN]  [fan]  Reconnecting (attempt 1)…

  - type: textarea
    id: raw_dps
    attributes:
      label: DP tables (optional but helpful)
      description: >
        Settings → DP Debug → select your device → **Copy Local DP Table**.
        Even better: also add **Copy Cloud DP Table** from the Cloud Lookup tab — it carries the
        data point names, types and allowed ranges, which the local table cannot show.
      render: text
      placeholder: |
        {
          "1": true,
          "3": "auto"
        }

  - type: textarea
    id: dp_specifications
    attributes:
      label: Cloud DP specification (data point names, types and ranges)
      description: >
        Cloud Lookup tab → **Show DPs** on the device's row → **Copy Cloud DP Table**.
        This is the only place the manufacturer's own names, declared types and allowed
        ranges exist — the local connection never transmits them. Filled in automatically
        when the report is started from **DP Debug → Report this device**.
      render: text
      placeholder: |
        switch                DP 1   Boolean   false
        dehumidify_set_value  DP 2   Integer   45      25-80 %
        mode                  DP 4   Enum      manual  manual,laundry

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Device model, screenshots, anything else that might help.
